plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
}

// Place build outputs outside OneDrive to avoid file-lock/permission issues
buildDir = file(System.getProperty('java.io.tmpdir') + '/doubt-resolution-system-build')

group = 'com.doubtresolver'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa:3.2.5'
    implementation 'org.springframework.boot:spring-boot-starter-web:3.2.5'
    implementation 'org.springframework.boot:spring-boot-starter-security:3.2.5'
    implementation 'org.springframework.boot:spring-boot-starter-validation:3.2.5'
    implementation 'org.springframework.boot:spring-boot-starter-mail:3.2.5'
    
    // JWT Dependencies
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    
    compileOnly 'org.projectlombok:lombok:1.18.36'
    developmentOnly 'org.springframework.boot:spring-boot-devtools:3.2.5'
    runtimeOnly 'com.mysql:mysql-connector-j:8.1.0'
    runtimeOnly 'com.h2database:h2:2.2.220'

    annotationProcessor 'org.projectlombok:lombok:1.18.36'
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.2.5'
    testImplementation 'org.springframework.security:spring-security-test:6.3.5'
}

tasks.named('test') {
    useJUnitPlatform()
}