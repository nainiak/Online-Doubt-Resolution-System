# Server configuration
server.port=8080

# Database configuration (H2 in-memory for local development)
spring.datasource.url=jdbc:h2:mem:doubtdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# JWT configuration (defaults for local development)
jwt.secret=ChangeThisSecretKeyForLocalDevChangeMe123456
jwt.expiration=86400000

# Mail defaults for local dev (no real SMTP required)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=no-reply@example.com
spring.mail.password=password
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false